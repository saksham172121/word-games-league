name = "word-games-league-push"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Runs every hour on the hour; the code only acts at MORNING_HOUR / EVENING_HOUR in TZ_NAME.
[triggers]
crons = ["0 * * * *"]

# Create with:  npx wrangler kv namespace create SUBS   → paste the printed id below.
[[kv_namespaces]]
binding = "SUBS"
id = "5094f36c69674ed5b0ed2e93c4e6be45"

[vars]
# Time zone for the morning/evening pushes (IANA name, e.g. Australia/Sydney, America/New_York, Europe/London).
TZ_NAME = "Australia/Sydney"
MORNING_HOUR = "8"
EVENING_HOUR = "15"
# Only the real app may call the Worker (browsers send this Origin header).
ALLOWED_ORIGINS = "https://saksham172121.github.io,http://localhost:8080"
FIREBASE_API_KEY = "AIzaSyB1ECvXTu7Xv2OxyQ63aoZ6oh-LnXK6dss"
FIREBASE_PROJECT_ID = "word-games-league"
VAPID_SUBJECT = "https://saksham172121.github.io/word-games-league/"
